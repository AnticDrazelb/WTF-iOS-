name: WTF
options:
  bundleIdPrefix: com.wtf
  deploymentTarget:
    iOS: "26.0"
packages:
  WTFCore:
    path: WTFCore
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.7
targets:
  WTF:
    type: application
    platform: iOS
    sources:
      - WTF
    dependencies:
      - package: WTFCore
      - package: FluidAudio
        product: FluidAudio
      - target: WTFWidgets
    info:
      path: WTF/Info.plist
      properties:
        CFBundleDisplayName: WTF
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.wtf.ios
            CFBundleURLSchemes: [wtf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: WTF listens for speech so it can remind you what you were on about. Silence is never stored, and everything stays on your iPhone.
        NSSpeechRecognitionUsageDescription: WTF turns what it hears into text on your iPhone.
        ITSAppUsesNonExemptEncryption: false
        NSContactsUsageDescription: WTF uses your contacts' names so it hears and spells the people you talk about correctly. They stay on your iPhone.
        NSCalendarsFullAccessUsageDescription: WTF checks the appointments it hears against your calendar, and learns the names and places in it so it hears them right. Nothing leaves your iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wtf.ios
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_PREVIEWS: "NO"

  WTFWidgets:
    type: app-extension
    platform: iOS
    sources:
      - WTFWidgets
      - WTF/Shared
    info:
      path: WTFWidgets/Info.plist
      properties:
        CFBundleDisplayName: WTF
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wtf.ios.widgets
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET"
